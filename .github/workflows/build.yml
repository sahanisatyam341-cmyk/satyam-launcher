name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            { grep -E '^e: ' build.log | head -8; sed -n '/What went wrong/,/^\* Try/p' build.log | head -10; } | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Satyam Launcher build ${{ github.run_number }}
          files: build/outputs/apk/debug/*.apk
